      var m = (location.pathname || '').match(/^\/ref\/([^\/?#]+)/);

        location.replace(
          'https://play.google.com/store/apps/details?id=com.logicandget.tanzanitemining&referrer='
          + encodeURIComponent(decodeURIComponent(m[1])));
      }
